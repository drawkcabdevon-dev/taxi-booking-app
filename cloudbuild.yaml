# Cloud Build — auto-deploy on push to main.
# Substitutions (set in the Cloud Build trigger):
#   _REGION: Cloud Run region (e.g. europe-west1)
#   _SERVICE: Cloud Run service name (e.g. waymaker-taxi-backend)
#   _PROJECT: GCP project id
# Frontend hosting is not wired yet (domain TBD): the build step below
# produces frontend/dist/; point it at Firebase Hosting or a Cloud Run
# static service once the subdomain is chosen.
steps:
  # Build the backend image.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/waymaker-taxi-backend:${SHORT_SHA}'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/waymaker-taxi-backend:latest'
      - '.'

  # Push the backend image.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/${PROJECT_ID}/waymaker-taxi-backend:${SHORT_SHA}'

  # Deploy the backend to Cloud Run.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image=gcr.io/${PROJECT_ID}/waymaker-taxi-backend:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=OWNER_EMAIL=waymakertaxiservices@gmail.com'

  # Build the frontend (artifact only until hosting is wired).
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'cd frontend && npm ci && npm run build'

substitutions:
  _REGION: europe-west1
  _SERVICE: waymaker-taxi-backend

options:
  logging: CLOUD_LOGGING_ONLY
